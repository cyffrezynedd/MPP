name: pipeline CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "Lab3/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "Lab3/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Lab3

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check server.js
          node --check logger.js

      - name: Run automated tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: taskdb
          NODE_ENV: test
        run: npm test