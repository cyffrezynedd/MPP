<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="app-header">
      <h1>Менеджер задач</h1>
    </header>

    <div id="errorNotification" class="alert hidden"></div>

    <div class="card">
      <h2 id="formHeader">Новая задача</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId">

        <div class="form-group">
          <label for="title">Название задачи *</label>
          <input type="text" id="title" required placeholder="Введите название">
        </div>

        <div class="form-group">
          <label for="description">Описание</label>
          <textarea id="description" rows="3" placeholder="Подробное описание"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="status">Статус</label>
            <select id="status">
            <option value="pending">Ожидает</option>
            <option value="in_progress">В работе</option>
            <option value="completed">Завершено</option>
            </select>
          </div>

          <div class="form-group flex-1">
            <label for="dueDate">Срок сдачи</label>
            <input type="date" id="dueDate">
          </div>
        </div>

        <div class="form-group">
          <label for="taskFile">Прикрепить файл</label>
          <input type="file" id="taskFile">
          <span id="currentFileNotice" class="file-notice hidden"></span>
        </div>

        <div class="form-buttons">
          <button type="submit" id="saveButton" class="btn btn-primary">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Сохранить
          </button>
          <button type="button" id="cancelButton" class="btn btn-secondary hidden">
            <svg class="icon" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            Отмена
          </button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="list-controls">
        <h2>Список задач</h2>
        <div class="filter-group">
          <label for="filterStatus">Фильтр:</label>
          <select id="filterStatus">
            <option value="all">Все статусы</option>
            <option value="pending">Ожидает</option>
            <option value="in_progress">В работе</option>
            <option value="completed">Завершено</option>
          </select>
        </div>
      </div>

      <div id="tasksList" class="tasks-container"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
